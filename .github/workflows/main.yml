name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node Dependencies & Sync Capacitor
      run: |
        if [ -f "package.json" ]; then
          npm install
          npm run build || echo "Web build finished"
          if command -v npx &> /dev/null; then
            npx cap add android 2>/dev/null || true
            npx cap sync android 2>/dev/null || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Ensure Environment and Signing Keystore
      run: |
        # Restore debug.keystore from base64 if gitignored
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "Generating new debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # Ensure .env exists from .env.example for Secrets Gradle plugin
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          cp .env.example .env
        fi

        # Sync to android/ directory if present
        if [ -d "android" ]; then
          cp debug.keystore android/ 2>/dev/null || true
          cp .env android/ 2>/dev/null || true
          cp .env.example android/ 2>/dev/null || true
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi
        fi

        if [ -f "gradlew" ]; then chmod +x gradlew; fi

    - name: Build Android APK (Gradle)
      env:
        CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ -f "gradlew" ]; then
          echo "Building root Android Gradle project with gradlew..."
          ./gradlew assembleDebug --stacktrace
        elif [ -f "android/gradlew" ]; then
          echo "Building nested android/ project with gradlew..."
          cd android && ./gradlew assembleDebug --stacktrace && cd ..
        else
          echo "gradlew not found, using system gradle..."
          gradle assembleDebug --stacktrace
        fi

    - name: Locate Generated APK
      id: find_apk
      run: |
        APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          echo "Successfully generated APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Failed to find generated .apk file!"
          exit 1
        fi

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: CompareCart-APK
        path: ${{ steps.find_apk.outputs.apk_path }}
        if-no-files-found: error
